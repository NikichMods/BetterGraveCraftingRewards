name: Build production candidate

on:
  push:
    branches:
      - 'dev/**'
      - 'feature/**'
      - main
    paths:
      - 'src/**'
      - 'BetterGraveCraftingRewards.csproj'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'BetterGraveCraftingRewards.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Project Version is missing.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $version"

      - name: Restore
        run: dotnet restore BetterGraveCraftingRewards.csproj

      - name: Build
        run: dotnet build BetterGraveCraftingRewards.csproj -c Release --no-restore --nologo

      - name: Prepare candidate
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $dll = Resolve-Path 'bin/Release/BetterGraveCraftingRewards.dll'
          $out = Join-Path $PWD 'artifact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $handoff = Join-Path $out "BetterGraveCraftingRewards-$version.dll"
          Copy-Item $dll $handoff
          $hash = (Get-FileHash $handoff -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "version=$version"
            "source_sha=${{ github.sha }}"
            "sha256=$hash"
            "installed_assembly=BetterGraveCraftingRewards.dll"
            "handoff_assembly=BetterGraveCraftingRewards-$version.dll"
          ) | Set-Content -Encoding UTF8 (Join-Path $out 'BUILD_IDENTITY.txt')
          Get-Content (Join-Path $out 'BUILD_IDENTITY.txt')

      - name: Upload candidate
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: BetterGraveCraftingRewards-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
